<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Monitor Nutto Gelato</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-image: url('tlo.jpg'); 
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            background-color: #ffffff;
            
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-transform: uppercase;
        }

        /* 
           ZMIENIONY PUNKT KOTWICZENIA SLOTU
           Kotwiczymy górną krawędź bloku (translate -50% w poziomie, 0 w pionie).
           Dzięki temu tekst trzyma się góry kafelka, a obrazek ma miejsce pod spodem.
        */
        .flavor-slot {
            position: absolute;
            transform: translate(-50%, 0);
            display: flex;
            flex-direction: column; 
            align-items: center;    
            justify-content: flex-start;
            width: 11vw; 
            height: 16vh; /* Bezpieczna wysokość całego kafelka na treść */
            text-align: center;
        }

        .flavor-text {
            display: block;
            font-size: 1.45vw; 
            font-weight: 800; 
            letter-spacing: -0.2px;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.1;
            margin-bottom: 8px; /* Odstęp tekstu od obrazka */
        }

        /* Elastyczna wielkość ikony pod tekstem */
        .flavor-icon {
            width: 4.8vw; 
            height: 4.8vw; 
            object-fit: contain;    
            margin-top: auto; /* Popycha ikonę do dolnej części zarezerwowanego obszaru */
        }

        /* 
           SKORYGOWANA MATRYCA POZYCJI DLA GÓRNEJ KRAWĘDZI OKIENEK
           Wartości 'top' zostały zmniejszone, aby napisy lądowały tuż pod górną kreską kafelka.
        */

        /* RZĄD 3 (Zapełniamy puste kafelki 2, 3 i 4 - obok Brigadeiro) */
        #slot-0 { top: 56.5%; left: 48.0%; } 
        #slot-1 { top: 56.5%; left: 59.3%; } 
        #slot-2 { top: 56.5%; left: 70.6%; } 

        /* RZĄD 4 (Cztery puste kafelki od lewej do prawej) */
        #slot-3 { top: 76.5%; left: 36.7%; } 
        #slot-4 { top: 76.5%; left: 48.0%; } 
        #slot-5 { top: 76.5%; left: 59.3%; } 
        #slot-6 { top: 76.5%; left: 70.6%; } 

    </style>
</head>
<body>

    <div id="menu-overlay"></div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSrdYDwv_7MojjqKKEz0yvGd03CdRfNcMhUlQdM0J_cWULAlVDfcxlwqR7GAp3uXzHogrO5DcrGUBIW/pub?output=csv';

        async function updateMenu() {
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                
                const lines = data.split('\n')
                                  .map(line => line.trim())
                                  .filter(line => line.length > 0);

                const overlay = document.getElementById('menu-overlay');
                overlay.innerHTML = ''; 

                lines.forEach((line, index) => {
                    if (index < 7) { 
                        const columns = line.split(',');
                        const flavorName = columns[0] ? columns[0].replace(/"/g, '').trim() : '';
                        const flavorImg = columns[1] ? columns[1].replace(/"/g, '').trim() : '';

                        const slotDiv = document.createElement('div');
                        slotDiv.className = 'flavor-slot';
                        slotDiv.id = `slot-${index}`;

                        // Generowanie nazwy smaku (Granat Nutto)
                        const textSpan = document.createElement('span');
                        textSpan.className = 'flavor-text';
                        textSpan.setAttribute('style', 'color: #0e265c !important;');
                        textSpan.textContent = flavorName;
                        slotDiv.appendChild(textSpan);

                        // Generowanie ikony na dole (jeśli podano link w drugiej kolumnie)
                        if (flavorImg) {
                            const img = document.createElement('img');
                            img.className = 'flavor-icon';
                            img.src = flavorImg;
                            img.alt = '';
                            slotDiv.appendChild(img);
                        }

                        overlay.appendChild(slotDiv);
                    }
                });
            } catch (error) {
                console.error('Błąd aktualizacji menu:', error);
            }
        }

        updateMenu();
        setInterval(updateMenu, 30000); 
    </script>
</body>
</html>
