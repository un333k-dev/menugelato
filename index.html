<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Monitor Gelato</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            /* Tło rozciągnięte na pełen ekran - bez bocznych pasów */
            background-image: url('tlo.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            
            /* DOKŁADNY KOLOR SZAFIROWEGO GRANATU JAK W ORYGINALE */
            color: #111C3C !important; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 1.5rem; 
            text-transform: uppercase;
        }

        /* Każde okienko traktowane jako niezależny punkt na siatce ekranu */
        .flavor-slot {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column; 
            align-items: center;    
            justify-content: center;
            gap: 12px;              
            width: 320px; 
            text-align: center;
        }

        .flavor-text {
            display: block;
            font-weight: 800; 
            color: #111C3C !important; /* Wymuszenie koloru dla tekstu */
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Ikona smaku umieszczona pod tekstem */
        .flavor-icon {
            width: 55px;            
            height: 55px; 
            object-fit: contain;    
        }

        /* 
           MATRYCA WSPÓŁRZĘDNYCH DLA DOLNYCH RZĘDÓW KAFLI
           Jeżeli po otwarciu na monitorze tekst jest lekko przesunięty, 
           zmień parametry top (góra/dół) i left (lewo/prawo) tylko dla danej pozycji.
        */

        /* RZĄD 3 (Smaki zmienne 1 - 4) */
        #slot-0 { top: 61.5%; left: 16.5%; } 
        #slot-1 { top: 61.5%; left: 38.8%; } 
        #slot-2 { top: 61.5%; left: 61.2%; } 
        #slot-3 { top: 61.5%; left: 83.5%; } 

        /* RZĄD 4 (Smaki zmienne 5 - 8) */
        #slot-4 { top: 82.5%; left: 16.5%; } 
        #slot-5 { top: 82.5%; left: 38.8%; } 
        #slot-6 { top: 82.5%; left: 61.2%; } 
        #slot-7 { top: 82.5%; left: 83.5%; } 

    </style>
</head>
<body>

    <!-- Wszystkie dynamiczne smaki wstrzykiwane bezpośrednio w przestrzeń ekranu -->
    <div id="menu-overlay"></div>

    <script>
        // TUTAJ WKLEJ LINK .CSV Z GOOGLE SHEETS
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSrdYDwv_7MojjqKKEz0yvGd03CdRfNcMhUlQdM0J_cWULAlVDfcxlwqR7GAp3uXzHogrO5DcrGUBIW/pub?output=csv';

        async function updateMenu() {
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                
                const lines = data.split('\n')
                                  .map(line => line.trim())
                                  .filter(line => line.length > 0);

                const overlay = document.getElementById('menu-overlay');
                overlay.innerHTML = ''; 

                lines.forEach((line, index) => {
                    if (index < 8) { 
                        const columns = line.split(',');
                        
                        // Zabezpieczenie danych i pobranie wartości z kolumn A i B
                        const flavorName = columns[0] ? columns[0].replace(/"/g, '').trim() : '';
                        const flavorImg = columns[1] ? columns[1].replace(/"/g, '').trim() : '';

                        const slotDiv = document.createElement('div');
                        slotDiv.className = 'flavor-slot';
                        slotDiv.id = `slot-${index}`;

                        // Generowanie tekstu w kolorze granatowym
                        const textSpan = document.createElement('span');
                        textSpan.className = 'flavor-text';
                        textSpan.textContent = flavorName;
                        slotDiv.appendChild(textSpan);

                        // Generowanie ikony
                        if (flavorImg) {
                            const img = document.createElement('img');
                            img.className = 'flavor-icon';
                            img.src = flavorImg;
                            img.alt = '';
                            slotDiv.appendChild(img);
                        }

                        overlay.appendChild(slotDiv);
                    }
                });
            } catch (error) {
                console.error('Błąd aktualizacji menu:', error);
            }
        }

        updateMenu();
        setInterval(updateMenu, 30000); 
    </script>
</body>
</html>
