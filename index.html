<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Monitor Nutto Gelato</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #ffffff;
        }

        body {
            background-image: url('tlo.jpg'); 
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-transform: uppercase;
        }

        .flavor-slot {
            position: absolute;
            transform: translate(-50%, 0);
            display: flex;
            flex-direction: column; 
            align-items: center;    
            justify-content: flex-start;
            width: 11vw; 
            height: 16vh; 
            text-align: center;
            margin: 0;
            padding: 0;
        }

        /* 
           ZAKTUALIZOWANY STYL TEKSTU
           Zmniejszono font-size do 1.2vw oraz usunięto blokadę linii, 
           co pozwala na automatyczne dzielenie długich nazw smaków.
        */
        .flavor-text {
            display: block;
            color: #0e265c !important; 
            font-size: 1.2vw; /* Zmniejszono z 1.45vw, aby tekst zgrabnie się mieścił */
            font-weight: 800; 
            letter-spacing: -0.2px;
            width: 100%;
            word-wrap: break-word; /* Bezpieczne łamanie długich słów w razie potrzeby */
            line-height: 1.15;
            margin-bottom: 6px;
        }

        .flavor-icon {
            width: 4.8vw; 
            height: 4.8vw; 
            object-fit: contain;    
            margin-top: auto; 
        }

        /* MATRYCA POZYCJI DLA GÓRNEJ KRAWĘDZI OKIENEK */
        #slot-0 { top: 56.5%; left: 48.0%; } 
        #slot-1 { top: 56.5%; left: 59.3%; } 
        #slot-2 { top: 56.5%; left: 70.6%; } 

        #slot-3 { top: 76.5%; left: 36.7%; } 
        #slot-4 { top: 76.5%; left: 48.0%; } 
        #slot-5 { top: 76.5%; left: 59.3%; } 
        #slot-6 { top: 76.5%; left: 70.6%; } 

    </style>
</head>
<body>

    <div id="menu-overlay"></div>

    <script>
        const csvUrl = 'TUTAJ_WKLEJ_SWOJ_LINK_CSV_Z_ARKUSZA_GOOGLE';

        async function updateMenu() {
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                
                const lines = data.split('\n')
                                  .map(line => line.trim())
                                  .filter(line => line.length > 0);

                const overlay = document.getElementById('menu-overlay');
                overlay.innerHTML = ''; 

                lines.forEach((line, index) => {
                    if (index < 7) { 
                        const columns = line.split(',');
                        
                        if (columns.length > 0) {
                            const flavorName = columns ? columns.replace(/"/g, '').trim() : '';
                            const flavorImg = columns ? columns.replace(/"/g, '').trim() : '';

                            const slotDiv = document.createElement('div');
                            slotDiv.className = 'flavor-slot';
                            slotDiv.id = `slot-${index}`;

                            const textSpan = document.createElement('span');
                            textSpan.className = 'flavor-text';
                            textSpan.textContent = flavorName;
                            slotDiv.appendChild(textSpan);

                            if (flavorImg) {
                                const img = document.createElement('img');
                                img.className = 'flavor-icon';
                                img.src = flavorImg;
                                img.alt = '';
                                slotDiv.appendChild(img);
                            }

                            overlay.appendChild(slotDiv);
                        }
                    }
                });
            } catch (error) {
                console.error('Błąd aktualizacji menu:', error);
            }
        }

        updateMenu();
        setInterval(updateMenu, 30000); 
    </script>
</body>
</html>
