<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Monitor Gelato</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-image: url('tlo.jpg'); 
            background-size: 100% 100%; /* Wymusza dokładne rozciągnięcie grafiki do krawędzi ekranu */
            background-position: center;
            background-repeat: no-repeat;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 
          SIATKA GŁÓWNA DLA 8 DOLNYCH KWADRATÓW
          Tworzy przezroczystą strefę dokładnie w dolnej połowie ekranu
        */
        #menu-overlay {
            position: absolute;
            /* Pozycjonowanie całej strefy na dole obrazu */
            bottom: 3.5%;       /* Odstęp od samego dołu ekranu (podnoś/opuszczaj całą strefę) */
            left: 5.2%;         /* Margines po lewej stronie ekranu */
            width: 89.6%;       /* Szerokość całej strefy z kafelkami */
            height: 41%;        /* Wysokość zajmowana przez 2 dolne rzędy kafelków */
            
            /* Budowanie automatycznej matrycy: 2 rzędy i 4 równe kolumny */
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 1fr);
            
            /* Odstępy między kafelkami (automatycznie dopasują się do przerw na zdjęciu) */
            column-gap: 5.5%;   
            row-gap: 13%;       
        }

        /* Styl pojedynczego okienka z tekstem i ikoną */
        .flavor-slot {
            display: flex;
            flex-direction: column; 
            align-items: center;    
            justify-content: center;
            gap: 10px;              /* Odstęp pionowy między tekstem a obrazkiem */
            width: 100%;
            height: 100%;
            
            /* GŁÓWNY STYL TEKSTU */
            color: #000000; 
            font-family: 'Arial Black', Gadget, sans-serif; 
            font-size: 1.5rem; /* Tutaj zmieniasz rozmiar czcionki */
            text-transform: uppercase;
        }

        .flavor-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 900;
            text-align: center;
            width: 100%;
        }

        /* Styl dla ikony smaku */
        .flavor-icon {
            width: 55px;            
            height: 55px; 
            object-fit: contain;    
        }
    </style>
</head>
<body>

    <!-- Przezroczysta siatka nakładana na dolne rzędy -->
    <div id="menu-overlay"></div>

    <script>
        // TUTAJ WKLEJ SWÓJ LINK .CSV Z GOOGLE SHEETS
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSrdYDwv_7MojjqKKEz0yvGd03CdRfNcMhUlQdM0J_cWULAlVDfcxlwqR7GAp3uXzHogrO5DcrGUBIW/pub?output=csv';

        async function updateMenu() {
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                
                const lines = data.split('\n')
                                  .map(line => line.trim())
                                  .filter(line => line.length > 0);

                const overlay = document.getElementById('menu-overlay');
                overlay.innerHTML = ''; 

                lines.forEach((line, index) => {
                    if (index < 8) { // Obsługujemy dokładnie 8 dolnych kwadratów
                        const columns = line.split(',');
                        const flavorName = columns[0] ? columns[0].replace(/"/g, '').trim() : '';
                        const flavorImg = columns[1] ? columns[1].replace(/"/g, '').trim() : '';

                        const slotDiv = document.createElement('div');
                        slotDiv.className = 'flavor-slot';

                        // 1. Nazwa smaku (Góra)
                        const textSpan = document.createElement('span');
                        textSpan.className = 'flavor-text';
                        textSpan.textContent = flavorName;
                        slotDiv.appendChild(textSpan);

                        // 2. Ikona smaku (Dół)
                        if (flavorImg) {
                            const img = document.createElement('img');
                            img.className = 'flavor-icon';
                            img.src = flavorImg;
                            img.alt = '';
                            slotDiv.appendChild(img);
                        }

                        overlay.appendChild(slotDiv);
                    }
                });
            } catch (error) {
                console.error('Błąd aktualizacji menu:', error);
            }
        }

        updateMenu();
        setInterval(updateMenu, 30000); 
    </script>
</body>
</html>
