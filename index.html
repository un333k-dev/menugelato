<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Monitor Gelato</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-image: url('tlo.jpg'); 
            background-size: 1920px 1080px; /* Sztywne zablokowanie proporcji grafiki pod format Full HD */
            background-position: top left;
            background-repeat: no-repeat;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            position: relative;
            background-color: #ffffff;
            
            /* STYLIZACJA IDENTYCZNA JAK "ŚMIETANKA PREMIUM" */
            color: #111c3c; /* Dokładny granatowo-indygowy odcień */
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            font-size: 26px; /* Wyraźna wielkość dopasowana do kafelków */
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Struktura pojedynczego okienka (Smak na górze, ikona pod nim) */
        .flavor-slot {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column; 
            align-items: center;    
            justify-content: center;
            gap: 10px;              
            width: 320px; /* Bezpieczna szerokość tekstu wewnątrz kwadratu */
            text-align: center;
        }

        .flavor-text {
            display: block;
            font-weight: 800; /* Mocna, gruba czcionka (Bold/Black) */
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Styl dla ikony smaku umieszczonej pod tekstem */
        .flavor-icon {
            width: 55px;            
            height: 55px; 
            object-fit: contain;    
        }

        /* 
           MATRYCA PIKSELI DLA PUSTYCH KWADRATÓW (EKRAN 1920x1080)
           Jeśli po wdrożeniu któryś kafel minimalnie ucieka, 
           zmień jego wartość 'top' (góra/dół) lub 'left' (lewo/prawo) w pikselach.
        */

        /* TRZECI RZĄD NA PLANSZY (Smaki zmienne 1 - 4) */
        #slot-0 { top: 665px; left: 315px; } 
        #slot-1 { top: 665px; left: 745px; } 
        #slot-2 { top: 665px; left: 1175px; } 
        #slot-3 { top: 665px; left: 1605px; } 

        /* CZWARTY RZĄD NA PLANSZY (Smaki zmienne 5 - 8) */
        #slot-4 { top: 890px; left: 315px; } 
        #slot-5 { top: 890px; left: 745px; } 
        #slot-6 { top: 890px; left: 1175px; } 
        #slot-7 { top: 890px; left: 1605px; } 

    </style>
</head>
<body>

    <!-- Miejsce na dane z arkusza -->
    <div id="menu-overlay"></div>

    <script>
        // PAMIĘTAJ O WKLEJENIU SWOJEGO LINKU .CSV Z GOOGLE SHEETS
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSrdYDwv_7MojjqKKEz0yvGd03CdRfNcMhUlQdM0J_cWULAlVDfcxlwqR7GAp3uXzHogrO5DcrGUBIW/pub?output=csv';

        async function updateMenu() {
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                
                const lines = data.split('\n')
                                  .map(line => line.trim())
                                  .filter(line => line.length > 0);

                const overlay = document.getElementById('menu-overlay');
                overlay.innerHTML = ''; 

                lines.forEach((line, index) => {
                    if (index < 8) { 
                        // NAPRAWIONY PODZIAŁ NA KOLUMNY:
                        const columns = line.split(',');
                        const flavorName = columns[0] ? columns[0].replace(/"/g, '').trim() : '';
                        const flavorImg = columns[1] ? columns[1].replace(/"/g, '').trim() : '';

                        const slotDiv = document.createElement('div');
                        slotDiv.className = 'flavor-slot';
                        slotDiv.id = `slot-${index}`;

                        // 1. Dodanie poprawnego granatowego tekstu
                        const textSpan = document.createElement('span');
                        textSpan.className = 'flavor-text';
                        textSpan.textContent = flavorName;
                        slotDiv.appendChild(textSpan);

                        // 2. Dodanie ikony pod tekstem
                        if (flavorImg) {
                            const img = document.createElement('img');
                            img.className = 'flavor-icon';
                            img.src = flavorImg;
                            img.alt = '';
                            slotDiv.appendChild(img);
                        }

                        overlay.appendChild(slotDiv);
                    }
                });
            } catch (error) {
                console.error('Błąd aktualizacji menu:', error);
            }
        }

        updateMenu();
        setInterval(updateMenu, 30000); 
    </script>
</body>
</html>
