<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Monitor Gelato</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-image: url('tlo.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            
            /* GŁÓWNY STYL DLA ZMIENNYCH SMAKÓW */
            color: #000000; /* Czarny tekst zgodnie z wytycznymi */
            font-family: 'Arial Black', Gadget, sans-serif; 
            font-size: 1.4rem; /* Dopasowana wielkość czcionki do wolnych kwadratów */
            text-transform: uppercase;
        }

        /* Styl kontenera (Tekst na górze, obrazek na dole, idealnie wycentrowane) */
        .flavor-slot {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column; 
            align-items: center;    
            justify-content: center;
            gap: 12px;              /* Odstęp pionowy pomiędzy tekstem a ikoną */
            width: 320px;           /* Szerokość dopasowana do szerokości kafla na zdjęciu */
        }

        .flavor-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 900;
            text-align: center;
            width: 100%;
        }

        /* Styl dla ikony smaku umieszczonej pod tekstem */
        .flavor-icon {
            width: 60px;            
            height: 60px; 
            object-fit: contain;    
        }

        /* 
           PRECYZYJNA MATRYCA DLA 8 PUSTYCH KWADRATÓW (2 DOLNE RZĘDY)
           Współrzędne zostały wyliczone na podstawie układu Twojej grafiki tła.
        */

        /* TRZECI RZĄD NA PLANSZY (Smaki zmienne 1 - 4) */
        #slot-0 { top: 61.5%; left: 16.5%; } /* Rząd 3, Kolumna 1 */
        #slot-1 { top: 61.5%; left: 38.8%; } /* Rząd 3, Kolumna 2 */
        #slot-2 { top: 61.5%; left: 61.2%; } /* Rząd 3, Kolumna 3 */
        #slot-3 { top: 61.5%; left: 83.5%; } /* Rząd 3, Kolumna 4 */

        /* CZWARTY RZĄD NA PLANSZY (Smaki zmienne 5 - 8) */
        #slot-4 { top: 82.5%; left: 16.5%; } /* Rząd 4, Kolumna 1 */
        #slot-5 { top: 82.5%; left: 38.8%; } /* Rząd 4, Kolumna 2 */
        #slot-6 { top: 82.5%; left: 61.2%; } /* Rząd 4, Kolumna 3 */
        #slot-7 { top: 82.5%; left: 83.5%; } /* Rząd 4, Kolumna 4 */

    </style>
</head>
<body>

    <!-- Miejsce na automatyczne wstrzykiwanie smaków z Google Sheets -->
    <div id="menu-overlay"></div>

    <script>
        // TUTAJ WKLEJ LINK .CSV Z GOOGLE SHEETS
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSrdYDwv_7MojjqKKEz0yvGd03CdRfNcMhUlQdM0J_cWULAlVDfcxlwqR7GAp3uXzHogrO5DcrGUBIW/pub?output=csv';

        async function updateMenu() {
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                
                const lines = data.split('\n')
                                  .map(line => line.trim())
                                  .filter(line => line.length > 0);

                const overlay = document.getElementById('menu-overlay');
                overlay.innerHTML = ''; 

                lines.forEach((line, index) => {
                    if (index < 8) { // Obsługujemy dokładnie 8 pustych slotów
                        const columns = line.split(',');
                        const flavorName = columns[0] ? columns[0].replace(/"/g, '').trim() : '';
                        const flavorImg = columns[1] ? columns[1].replace(/"/g, '').trim() : '';

                        const slotDiv = document.createElement('div');
                        slotDiv.className = 'flavor-slot';
                        slotDiv.id = `slot-${index}`;

                        // 1. Dodanie czarnego tekstu na górze
                        const textSpan = document.createElement('span');
                        textSpan.className = 'flavor-text';
                        textSpan.textContent = flavorName;
                        slotDiv.appendChild(textSpan);

                        // 2. Dodanie ikony bezpośrednio pod tekstem
                        if (flavorImg) {
                            const img = document.createElement('img');
                            img.className = 'flavor-icon';
                            img.src = flavorImg;
                            img.alt = '';
                            slotDiv.appendChild(img);
                        }

                        overlay.appendChild(slotDiv);
                    }
                });
            } catch (error) {
                console.error('Błąd aktualizacji menu:', error);
            }
        }

        updateMenu();
        setInterval(updateMenu, 30000); // Automatyczne sprawdzanie zmian w tabeli co 30 sekund
    </script>
</body>
</html>
