<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Monitor Nutto Gelato</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #ffffff;
        }

        body {
            background-image: url('tlo.png'); 
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-transform: uppercase;
        }

        .flavor-slot {
            position: absolute;
            transform: translate(-50%, 0);
            display: flex;
            flex-direction: column; 
            align-items: center;    
            justify-content: flex-start;
            width: 11vw; 
            height: 16vh; 
            text-align: center;
            margin: 0;
            padding: 0;
        }

        /* Subtelnie zmniejszona czcionka do 1.05vw daje pełne bezpieczeństwo przy bocznych liniach */
        .flavor-text {
            display: block;
            color: #0e265c !important; 
            font-size: 1.05vw; 
            font-weight: 800; 
            letter-spacing: -0.2px;
            width: 100%;
            white-space: normal !important; 
            word-wrap: break-word; 
            line-height: 1.15;
            margin-top: 5px; 
            margin-bottom: 6px;
        }

        .flavor-icon {
            width: 4.8vw; 
            height: 4.8vw; 
            object-fit: contain;    
            margin-top: auto; 
        }

        /* MATRYCA POZYCJI - KAFAEL PO KAFELKU W IDEALNEJ KOLEJNOŚCI */
        #slot-0 { top: 36.5%; left: 70.6%; } /* Rząd 2, Kolumna 4 (Sorbet Kiwi) */
        #slot-1 { top: 56.5%; left: 48.0%; } /* Rząd 3, Kolumna 2 */
        #slot-2 { top: 56.5%; left: 59.3%; } /* Rząd 3, Kolumna 3 */
        #slot-3 { top: 56.5%; left: 70.6%; } /* Rząd 3, Kolumna 4 */
        #slot-4 { top: 76.5%; left: 36.7%; } /* Rząd 4, Kolumna 1 */
        #slot-5 { top: 76.5%; left: 48.0%; } /* Rząd 4, Kolumna 2 */
        #slot-6 { top: 76.5%; left: 59.3%; } /* Rząd 4, Kolumna 3 */

    </style>
</head>
<body>

    <div id="menu-overlay"></div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSrdYDwv_7MojjqKKEz0yvGd03CdRfNcMhUlQdM0J_cWULAlVDfcxlwqR7GAp3uXzHogrO5DcrGUBIW/pub?output=csv';

        async function updateMenu() {
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                
                // Nowy, zaawansowany parser usuwający ukryte znaki Windows/Excel (\r) i puste linie
                const validFlavors = data.split('\n')
                    .map(line => line.replace(/\r/g, '').trim())
                    .filter(line => line.length > 0)
                    .map(line => {
                        const columns = line.split(',');
                        const rawName = columns.shift() || '';
                        const rawImg = columns.shift() || '';
                        return {
                            name: rawName.replace(/"/g, '').trim(),
                            img: rawImg.replace(/"/g, '').trim()
                        };
                    })
                    .filter(flavor => flavor.name.length > 0); // Odrzucenie pustych wpisów

                const overlay = document.getElementById('menu-overlay');
                overlay.innerHTML = ''; 

                // Wstrzykiwanie dokładnie przefiltrowanych smaków
                validFlavors.forEach((flavor, index) => {
                    if (index < 7) { 
                        const slotDiv = document.createElement('div');
                        slotDiv.className = 'flavor-slot';
                        slotDiv.id = `slot-${index}`;

                        const textSpan = document.createElement('span');
                        textSpan.className = 'flavor-text';
                        textSpan.textContent = flavor.name;
                        slotDiv.appendChild(textSpan);

                        if (flavor.img) {
                            const img = document.createElement('img');
                            img.className = 'flavor-icon';
                            img.src = flavor.img;
                            img.alt = '';
                            slotDiv.appendChild(img);
                        }

                        overlay.appendChild(slotDiv);
                    }
                });
            } catch (error) {
                console.error('Błąd aktualizacji menu:', error);
            }
        }

        updateMenu();
        setInterval(updateMenu, 30000); 
    </script>
</body>
</html>
