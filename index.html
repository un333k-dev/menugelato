<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Monitor Gelato</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000; /* Czarne tło jako margines bezpieczeństwa */
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 
           GŁÓWNE PUDEŁKO STRONY
           Zawiera obrazek oraz nakładkę z napisami. Gwarantuje brak ucinania grafiki.
        */
        .container {
            position: relative;
            width: 100vw;
            max-width: 177.78vh; /* Blokada proporcji 16:9 dla ekranów Full HD/4K */
            display: inline-block;
        }

        /* Obraz tła wstawiony jako elastyczny plik, który nigdy się nie przytnie */
        .menu-bg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Warstwa nakładana bezpośrednio na obrazek */
        #menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Styl dla pojedynczego okienka smaku */
        .flavor-slot {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column; 
            align-items: center;    
            justify-content: center;
            width: 16%; /* Szerokość tekstu dopasowana do kafelka */
            text-align: center;
        }

        /* DOKŁADNY STYL, ROZMIAR I KOLOR JAK "ŚMIETANKA PREMIUM" */
        .flavor-text {
            display: block;
            color: #111c3c !important; /* Ten sam granat */
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 2.1vw; /* Wielkość liter skaluje się proporcjonalnie do szerokości obrazu */
            font-weight: 800; /* Identyczne pogrubienie */
            text-transform: uppercase;
            letter-spacing: 0.5px;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Ikona smaku pod tekstem */
        .flavor-icon {
            width: 4vw; /* Skaluje się razem z ekranem */
            height: 4vw; 
            object-fit: contain;    
            margin-top: 4px;
        }

        /* 
           PRECYZYJNA MATRYCA POZYCJI DLA TWOICH KWADRATÓW
           Współrzędne procentowe liczone są teraz bezpośrednio od krawędzi obrazka, 
           więc napisy trafią w kafelki na każdym urządzeniu.
        */

        /* RZĄD 3 (Smaki zmienne 1 - 4) */
        #slot-0 { top: 61.5%; left: 16.5%; } 
        #slot-1 { top: 61.5%; left: 38.9%; } 
        #slot-2 { top: 61.5%; left: 61.1%; } 
        #slot-3 { top: 61.5%; left: 83.5%; } 

        /* RZĄD 4 (Smaki zmienne 5 - 8) */
        #slot-4 { top: 82.5%; left: 16.5%; } 
        #slot-5 { top: 82.5%; left: 38.9%; } 
        #slot-6 { top: 82.5%; left: 61.1%; } 
        #slot-7 { top: 82.5%; left: 83.5%; } 

    </style>
</head>
<body>

    <!-- Główna struktura wiążąca grafikę z napisami -->
    <div class="container">
        <img src="tlo.jpg" alt="Menu" class="menu-bg">
        <div id="menu-overlay"></div>
    </div>

    <script>
        // WPISZ TUTAJ SWÓJ LINK .CSV Z GOOGLE SHEETS
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSrdYDwv_7MojjqKKEz0yvGd03CdRfNcMhUlQdM0J_cWULAlVDfcxlwqR7GAp3uXzHogrO5DcrGUBIW/pub?output=csv';

        async function updateMenu() {
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                
                const lines = data.split('\n')
                                  .map(line => line.trim())
                                  .filter(line => line.length > 0);

                const overlay = document.getElementById('menu-overlay');
                overlay.innerHTML = ''; 

                lines.forEach((line, index) => {
                    if (index < 8) { 
                        const columns = line.split(',');
                        const flavorName = columns[0] ? columns[0].replace(/"/g, '').trim() : '';
                        const flavorImg = columns[1] ? columns[1].replace(/"/g, '').trim() : '';

                        const slotDiv = document.createElement('div');
                        slotDiv.className = 'flavor-slot';
                        slotDiv.id = `slot-${index}`;

                        // Generowanie tekstu
                        const textSpan = document.createElement('span');
                        textSpan.className = 'flavor-text';
                        textSpan.textContent = flavorName;
                        slotDiv.appendChild(textSpan);

                        // Generowanie ikony pod tekstem
                        if (flavorImg) {
                            const img = document.createElement('img');
                            img.className = 'flavor-icon';
                            img.src = flavorImg;
                            img.alt = '';
                            slotDiv.appendChild(img);
                        }

                        overlay.appendChild(slotDiv);
                    }
                });
            } catch (error) {
                console.error('Błąd aktualizacji menu:', error);
            }
        }

        updateMenu();
        setInterval(updateMenu, 30000); // Odświeżanie danych co 30 sekund
    </script>
</body>
</html>
