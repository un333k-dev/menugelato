<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Monitor Nutto Gelato</title>
    <style>
        /* Całkowite wyczyszczenie marginesów przeglądarki - usuwa paski */
        * {
            box-sizing: border-box;
            margin: 0 !important;
            padding: 0 !important;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #ffffff;
        }

        body {
            /* Idealne rozciągnięcie planszy Nutto na pełny ekran */
            background-image: url('tlo.jpg'); 
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-transform: uppercase;
        }

        /* Kontener slotu trzymający się góry kafelka */
        .flavor-slot {
            position: absolute;
            transform: translate(-50%, 0);
            display: flex;
            flex-direction: column; 
            align-items: center;    
            justify-content: flex-start;
            width: 11vw; 
            height: 16vh; 
            text-align: center;
        }

        /* 
           STAŁE I NIEZMIENNE WYMORSZENIE GRANATU NUTTO
           Kolor wpisany bezpośrednio tutaj z "!important" sprawi, 
           że Chrome na Macu i iiyama wyświetlą piękny, głęboki granat.
        */
        .flavor-text {
            display: block;
            color: #0e265c !important; 
            font-size: 1.45vw; 
            font-weight: 800; 
            letter-spacing: -0.2px;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.1;
        }

        /* Ikona owocu/dodatku pod tekstem */
        .flavor-icon {
            width: 4.8vw; 
            height: 4.8vw; 
            object-fit: contain;    
            margin-top: 8px !important; 
        }

        /* MATRYCA POZYCJI DLA GÓRNEJ KRAWĘDZI OKIENEK */
        /* RZĄD 3 (Obok Brigadeiro) */
        #slot-0 { top: 56.5%; left: 48.0%; } 
        #slot-1 { top: 56.5%; left: 59.3%; } 
        #slot-2 { top: 56.5%; left: 70.6%; } 

        /* RZĄD 4 (Cały dolny rząd) */
        #slot-3 { top: 76.5%; left: 36.7%; } 
        #slot-4 { top: 76.5%; left: 48.0%; } 
        #slot-5 { top: 76.5%; left: 59.3%; } 
        #slot-6 { top: 76.5%; left: 70.6%; } 

    </style>
</head>
<body>

    <div id="menu-overlay"></div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSrdYDwv_7MojjqKKEz0yvGd03CdRfNcMhUlQdM0J_cWULAlVDfcxlwqR7GAp3uXzHogrO5DcrGUBIW/pub?output=csv';

        async function updateMenu() {
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                
                const lines = data.split('\n')
                                  .map(line => line.trim())
                                  .filter(line => line.length > 0);

                const overlay = document.getElementById('menu-overlay');
                overlay.innerHTML = ''; 

                lines.forEach((line, index) => {
                    if (index < 7) { 
                        const columns = line.split(',');
                        const flavorName = columns ? columns.replace(/"/g, '').trim() : '';
                        const flavorImg = columns ? columns.replace(/"/g, '').trim() : '';

                        const slotDiv = document.createElement('div');
                        slotDiv.className = 'flavor-slot';
                        slotDiv.id = `slot-${index}`;

                        // Generowanie czystego tekstu (kolor czerpie z klasy CSS .flavor-text)
                        const textSpan = document.createElement('span');
                        textSpan.className = 'flavor-text';
                        textSpan.textContent = flavorName;
                        slotDiv.appendChild(textSpan);

                        if (flavorImg) {
                            const img = document.createElement('img');
                            img.className = 'flavor-icon';
                            img.src = flavorImg;
                            img.alt = '';
                            slotDiv.appendChild(img);
                        }

                        overlay.appendChild(slotDiv);
                    }
                });
            } catch (error) {
                console.error('Błąd aktualizacji menu:', error);
            }
        }

        updateMenu();
        setInterval(updateMenu, 30000); 
    </script>
</body>
</html>
