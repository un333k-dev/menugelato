<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Monitor Gelato</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            background-color: #000000; /* Czarne pasy bezpieczeństwa, jeśli ekran miałby inne proporcje */
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            
            /* DOKŁADNY KOLOR I STYL JAK "ŚMIETANKA PREMIUM" */
            color: #111c3c; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* 
           GŁÓWNY KONTENER TABLICY MENU 
           Blokuje proporcje ekranu 16:9. Wszystko wewnątrz skaluje się idealnie razem z tłem.
        */
        .menu-wrapper {
            position: relative;
            width: 100vw;
            height: 56.25vw; /* Konstrukcja proporcji 16:9 bazująca na szerokości */
            max-height: 100vh;
            max-width: 177.78vh; /* Zabezpieczenie przed rozciąganiem w pionie */
            
            background-image: url('tlo.jpg'); 
            background-size: 100% 100%; /* Elastyczne, pełne rozciągnięcie wewnątrz kontenera */
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Styl dla pojedynczego okienka smaku */
        .flavor-slot {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column; 
            align-items: center;    
            justify-content: center;
            width: 17%; /* Szerokość kafelka wyrażona w procentach kontenera */
            text-align: center;
        }

        /* Dynamiczny rozmiar tekstu reagujący na wielkość okna */
        .flavor-text {
            display: block;
            font-weight: 800; 
            font-size: 2.2cqi; /* Rozmiar czcionki skaluje się płynnie wraz z rozmiarem całej planszy */
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Elastyczna ikona smaku umieszczona pod tekstem */
        .flavor-icon {
            width: 4.5cqi; /* Wielkość ikony również dopasowuje się do skali tła */
            height: 4.5cqi; 
            object-fit: contain;    
            margin-top: 2%;
        }

        /* 
           MATRYCA PROCENTOWA (X, Y) WPISANA W STRUKTURĘ 16:9
           Te punkty określają środek geometryczny Twoich 8 dolnych kwadratów.
           Jeżeli po wdrożeniu jakiś smak minimalnie ucieka, delikatnie zmień jego procenty.
        */

        /* RZĄD 3 (Smaki zmienne 1 - 4) */
        #slot-0 { top: 61.5%; left: 16.6%; } 
        #slot-1 { top: 61.5%; left: 38.9%; } 
        #slot-2 { top: 61.5%; left: 61.1%; } 
        #slot-3 { top: 61.5%; left: 83.4%; } 

        /* RZĄD 4 (Smaki zmienne 5 - 8) */
        #slot-4 { top: 82.5%; left: 16.6%; } 
        #slot-5 { top: 82.5%; left: 38.9%; } 
        #slot-6 { top: 82.5%; left: 61.1%; } 
        #slot-7 { top: 82.5%; left: 83.4%; } 

    </style>
</head>
<body>

    <!-- Wszystko zamykamy w jednym elastycznym pudełku o stałych proporcjach -->
    <div class="menu-wrapper">
        <div id="menu-overlay"></div>
    </div>

    <script>
        // TUTAJ WKLEJ LINK .CSV Z GOOGLE SHEETS
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSrdYDwv_7MojjqKKEz0yvGd03CdRfNcMhUlQdM0J_cWULAlVDfcxlwqR7GAp3uXzHogrO5DcrGUBIW/pub?output=csv';

        async function updateMenu() {
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                
                const lines = data.split('\n')
                                  .map(line => line.trim())
                                  .filter(line => line.length > 0);

                const overlay = document.getElementById('menu-overlay');
                overlay.innerHTML = ''; 

                lines.forEach((line, index) => {
                    if (index < 8) { 
                        const columns = line.split(',');
                        const flavorName = columns[0] ? columns[0].replace(/"/g, '').trim() : '';
                        const flavorImg = columns[1] ? columns[1].replace(/"/g, '').trim() : '';

                        const slotDiv = document.createElement('div');
                        slotDiv.className = 'flavor-slot';
                        slotDiv.id = `slot-${index}`;

                        // Tekst
                        const textSpan = document.createElement('span');
                        textSpan.className = 'flavor-text';
                        textSpan.textContent = flavorName;
                        slotDiv.appendChild(textSpan);

                        // Ikona pod tekstem
                        if (flavorImg) {
                            const img = document.createElement('img');
                            img.className = 'flavor-icon';
                            img.src = flavorImg;
                            img.alt = '';
                            slotDiv.appendChild(img);
                        }

                        overlay.appendChild(slotDiv);
                    }
                });
            } catch (error) {
                console.error('Błąd aktualizacji menu:', error);
            }
        }

        updateMenu();
        setInterval(updateMenu, 30000); 
    </script>
</body>
</html>
