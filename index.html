<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Monitor Gelato</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-image: url('tlo.jpg'); 
            background-size: 100% 100%; /* Wymuszenie idealnego rozciągnięcia do krawędzi ekranu */
            background-position: center;
            background-repeat: no-repeat;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            
            /* DOKŁADNY KOLOR I STYL JAK "ŚMIETANKA PREMIUM" */
            color: #111c3c; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            font-size: 1.45rem; 
            text-transform: uppercase;
            letter-spacing: 0.2px; /* Lekkie światło między literami jak w oryginale */
        }

        /* Struktura slotu (Tekst na górze, ikona na dole) */
        .flavor-slot {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column; 
            align-items: center;    
            justify-content: center;
            gap: 8px;              
            width: 17vw; /* Szerokość bezpieczna dla kafelków */
            text-align: center;
        }

        .flavor-text {
            display: inline-block;
            font-weight: 800; /* Gruby font (Bold / Extra Bold) */
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            /* Automatyczne ściskanie tekstu w poziomie, jeśli nazwa smaku jest za długa dla kafelka */
            transform-origin: center;
        }

        /* Styl dla ikony smaku umieszczonej pod tekstem */
        .flavor-icon {
            width: 55px;            
            height: 55px; 
            object-fit: contain;    
        }

        /* 
           PRECYZYJNA MATRYCA POZYCJI DLA TWOICH KWADRATÓW
           Wartości procentowe określają środek każdego z 8 pustych kafelków.
        */

        /* RZĄD 3 (Smaki zmienne 1 - 4) */
        #slot-0 { top: 61.3%; left: 16.5%; } 
        #slot-1 { top: 61.3%; left: 38.8%; } 
        #slot-2 { top: 61.3%; left: 61.2%; } 
        #slot-3 { top: 61.3%; left: 83.5%; } 

        /* RZĄD 4 (Smaki zmienne 5 - 8) */
        #slot-4 { top: 82.3%; left: 16.5%; } 
        #slot-5 { top: 82.3%; left: 38.8%; } 
        #slot-6 { top: 82.3%; left: 61.2%; } 
        #slot-7 { top: 82.3%; left: 83.5%; } 

    </style>
</head>
<body>

    <!-- Overlay na dynamiczne smaki -->
    <div id="menu-overlay"></div>

    <script>
        // TUTAJ WKLEJ LINK .CSV Z GOOGLE SHEETS
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSrdYDwv_7MojjqKKEz0yvGd03CdRfNcMhUlQdM0J_cWULAlVDfcxlwqR7GAp3uXzHogrO5DcrGUBIW/pub?output=csv';

        async function updateMenu() {
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                
                const lines = data.split('\n')
                                  .map(line => line.trim())
                                  .filter(line => line.length > 0);

                const overlay = document.getElementById('menu-overlay');
                overlay.innerHTML = ''; 

                lines.forEach((line, index) => {
                    if (index < 8) { 
                        const columns = line.split(',');
                        const flavorName = columns ? columns.replace(/"/g, '').trim() : '';
                        const flavorImg = columns ? columns.replace(/"/g, '').trim() : '';

                        const slotDiv = document.createElement('div');
                        slotDiv.className = 'flavor-slot';
                        slotDiv.id = `slot-${index}`;

                        // Tekst smaku
                        const textSpan = document.createElement('span');
                        textSpan.className = 'flavor-text';
                        textSpan.textContent = flavorName;
                        slotDiv.appendChild(textSpan);

                        // Ikona smaku pod spodem
                        if (flavorImg) {
                            const img = document.createElement('img');
                            img.className = 'flavor-icon';
                            img.src = flavorImg;
                            img.alt = '';
                            slotDiv.appendChild(img);
                        }

                        overlay.appendChild(slotDiv);

                        // Skrypt ściskający tekst w poziomie, jeśli jest za długi dla ramki kafelka
                        setTimeout(() => {
                            const currentWidth = textSpan.scrollWidth;
                            const maxWidth = slotDiv.offsetWidth;
                            if (currentWidth > maxWidth) {
                                const scaleFactor = maxWidth / currentWidth;
                                textSpan.style.transform = `scaleX(${scaleFactor})`;
                            }
                        }, 50);
                    }
                });
            } catch (error) {
                console.error('Błąd aktualizacji menu:', error);
            }
        }

        updateMenu();
        setInterval(updateMenu, 30000); // Odświeżanie co 30 sekund
    </script>
</body>
</html>
