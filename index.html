<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Monitor Nutto Gelato</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 
           GŁÓWNE PUDEŁKO STRONY
           Blokuje i pilnuje proporcji 16:9 Twojej planszy.
        */
        .menu-container {
            position: relative;
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            background-image: url('tlo.jpg'); 
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Styl dla pojedynczego okienka ze zmiennym smakiem */
        .flavor-slot {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column; 
            align-items: center;    
            justify-content: center;
            width: 10.8%; /* Precyzyjna szerokość pojedynczego kwadratu w tabeli Nutto */
            text-align: center;
        }

        /* STYLIZACJA IDENTYCZNA JAK W STAŁYCH NAPISACH NUTTO */
        .flavor-text {
            display: block;
            color: #0e265c !important; /* Dokładny granat pobrany z planszy */
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            font-size: 1.4cqi; /* Elastyczna wielkość liter dopasowująca się do skali monitora */
            font-weight: 800; /* Mocne, eleganckie pogrubienie */
            text-transform: uppercase;
            letter-spacing: -0.2px;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.1;
        }

        /* Ikona owocu/dodatku umieszczona dokładnie pod tekstem */
        .flavor-icon {
            width: 4.8cqi; 
            height: 4.8cqi; 
            object-fit: contain;    
            margin-top: 8px; /* Odstęp pionowy */
        }

        /* 
           PRECYZYJNA MATRYCA POZYCJI DLA TWOICH PUSTYCH KWADRATÓW
           Współrzędne (X, Y) obliczone bezpośrednio z proporcji tabeli Nutto Gelato.
        */

        /* RZĄD 3 (Kafel 1 to Brigadeiro, więc zapełniamy puste kafelki 2, 3 i 4) */
        #slot-0 { top: 64.5%; left: 48.0%; } /* Trzeci rząd, druga kolumna */
        #slot-1 { top: 64.5%; left: 59.3%; } /* Trzeci rząd, trzecia kolumna */
        #slot-2 { top: 64.5%; left: 70.6%; } /* Trzeci rząd, czwarta kolumna */

        /* RZĄD 4 (Cztery puste kafelki od lewej do prawej) */
        #slot-3 { top: 84.3%; left: 36.7%; } /* Czwarty rząd, pierwsza kolumna */
        #slot-4 { top: 84.3%; left: 48.0%; } /* Czwarty rząd, druga kolumna */
        #slot-5 { top: 84.3%; left: 59.3%; } /* Czwarty rząd, trzecia kolumna */
        #slot-6 { top: 84.3%; left: 70.6%; } /* Czwarty rząd, czwarta kolumna */

    </style>
</head>
<body>

    <div class="menu-container">
        <!-- Warstwa wtryskiwania dynamicznych smaków -->
        <div id="menu-overlay"></div>
    </div>

    <script>
        // TUTAJ WKLEJ LINK .CSV Z GOOGLE SHEETS
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSrdYDwv_7MojjqKKEz0yvGd03CdRfNcMhUlQdM0J_cWULAlVDfcxlwqR7GAp3uXzHogrO5DcrGUBIW/pub?output=csv';

        async function updateMenu() {
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                
                const lines = data.split('\n')
                                  .map(line => line.trim())
                                  .filter(line => line.length > 0);

                const overlay = document.getElementById('menu-overlay');
                overlay.innerHTML = ''; 

                // Obsługujemy dokładnie 7 wolnych miejsc (slot-0 do slot-6)
                lines.forEach((line, index) => {
                    if (index < 7) { 
                        const columns = line.split(',');
                        const flavorName = columns[0] ? columns[0].replace(/"/g, '').trim() : '';
                        const flavorImg = columns[1] ? columns[1].replace(/"/g, '').trim() : '';

                        const slotDiv = document.createElement('div');
                        slotDiv.className = 'flavor-slot';
                        slotDiv.id = `slot-${index}`;

                        // Generowanie nazwy smaku (Granat)
                        const textSpan = document.createElement('span');
                        textSpan.className = 'flavor-text';
                        textSpan.textContent = flavorName;
                        slotDiv.appendChild(textSpan);

                        // Generowanie dedykowanej ikony pod tekstem
                        if (flavorImg) {
                            const img = document.createElement('img');
                            img.className = 'flavor-icon';
                            img.src = flavorImg;
                            img.alt = '';
                            slotDiv.appendChild(img);
                        }

                        overlay.appendChild(slotDiv);
                    }
                });
            } catch (error) {
                console.error('Błąd aktualizacji menu:', error);
            }
        }

        updateMenu();
        setInterval(updateMenu, 30000); // Automatyczna aktualizacja z arkusza co 30 sekund
    </script>
</body>
</html>
